# Portable executable qualification specification.
# Local DSR/direct receipts are authoritative. GitHub-hosted execution is supplementary only.
name: portable qualification specification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fss-portable-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy contract
    runs-on: [self-hosted, fss-linux-amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Execute repository-owned policy lane
        run: bash scripts/qualify.sh --lane policy

  rust:
    name: pinned-nightly Rust contract
    runs-on: [self-hosted, fss-linux-amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Execute repository-owned Rust lane
        run: bash scripts/qualify.sh --lane rust
