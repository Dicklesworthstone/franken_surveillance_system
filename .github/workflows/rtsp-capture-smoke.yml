# Supplementary fixture checks, not DSR or release qualification.
# Existing policy/Rust lanes remain in ci.yml and scripts/qualify.sh.
name: RTSP capture reference smoke

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rtsp-capture-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_NET_OFFLINE: "true"
      RUSTUP_AUTO_INSTALL: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Bootstrap the pinned compiler and inspection tools
        run: rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt,clippy,rust-src
      - name: Check feature formatting without rewriting compiler inputs
        run: >-
          rustfmt +nightly-2026-08-31 --check --edition 2024 --config skip_children=true
          crates/fss-cli/src/bin/fss-capture-rtsp.rs
          crates/fss-cli/src/bin/fss-capture-rtsp/*.rs
          crates/fss-cli/tests/capture_rtsp_cli.rs crates/fss-cli/tests/capture_rtsp_cli/*.rs
          crates/fss-cli/src/bin/fss-archive/work.rs crates/fss-cli/src/bin/fss-archive/pins.rs
          crates/fss-cli/tests/hevc_archive_recovery_process.rs
          crates/fss-reference/src/rtsp/live_avc.rs
          crates/fss-reference/src/rtsp/live_avc/recording.rs
          crates/fss-reference/src/rtsp/live_avc/recording/tests.rs
          crates/fss-reference/src/rtsp/live_hevc_archive.rs
          crates/fss-reference/tests/live_hevc_archive_contract.rs
          crates/fss-cli/src/bin/fss-event/corroborate.rs
          crates/fss-cli/src/bin/fss-event/corroborate/streaming.rs
          crates/fss-cli/tests/corroborate_stream_cli.rs
          crates/fss-cli/tests/corroborate_stream_geometry_cli.rs
          crates/fss-reference/src/ingest/ground_visibility.rs
          crates/fss-reference/src/ingest/recorded_corroboration.rs
          crates/fss-reference/src/ingest/recorded_corroboration/streaming.rs
          crates/fss-reference/src/ingest/recorded_corroboration/streaming/recipe.rs
          crates/fss-reference/src/ingest/recorded_corroboration/streaming/geometry.rs
          crates/fss-reference/src/ingest/long_event_replay/corroboration.rs
          crates/fss-reference/src/ingest/long_event_replay/corroboration/detector.rs
          crates/fss-reference/tests/rtsp_catalog_import_contract/pages.rs
          crates/fss-reference/tests/rtsp_catalog_import_contract/pages/failures.rs
          crates/fss-model-ir/tests/model_ir_contract.rs
      - name: Preserve frozen model identities with registered RTSP profiles
        if: success() || failure()
        run: |
          cargo +nightly-2026-08-31 test --locked --offline -p fss-model-ir --test model_ir_contract
          python3 -B tests/test_schema_validate.py TestSchemaConstitution.test_authoritative_constitution TestSchemaConstitutionCrossReviewRegressions.test_unregistered_implemented_schemas_drift_detection
      - name: Complete catalog custody and cold AVC/HEVC composition
        if: success() || failure()
        run: cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --test rtsp_catalog_import_contract
      - name: Native HEVC socket ownership and Digest retirement
        if: success() || failure()
        run: cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --lib rtsp::live_hevc::tests
      - name: Automatic native HEVC recording and cold source replay
        if: success() || failure()
        run: cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --test live_hevc_recording_contract
      - name: Existing HEVC capture and root-last publication contracts
        if: success() || failure()
        run: cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --test hevc_capture_contract --test hevc_recording_publication_contract
      - name: Protected HEVC work and existing AVC recovery barriers
        if: success() || failure()
        run: >-
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference
          --test hevc_archive_pin_contract --test archive_work_checkpoint
          --test archive_write_ahead --test archive_pin_pipeline
      - name: Selected HEVC live capture and protected final drain
        if: success() || failure()
        run: cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --test live_hevc_archive_contract
      - name: Native capture, whole-recording geometry and cold evidence contracts
        if: success() || failure()
        run: >-
          cargo +nightly-2026-08-31 test --locked --offline -p fss-cli
          --bin fss-capture-rtsp --test capture_rtsp_cli
          --test corroborate_stream_geometry_cli --test corroborate_stream_cli
          --test corroborate_stream_detector_cli --test historical_health_corroboration_cli
          --test long_event_replay_cli
      - name: Operator HEVC work and independent pin recovery
        if: success() || failure()
        run: cargo +nightly-2026-08-31 test --locked --offline -p fss-cli --test hevc_archive_recovery_process
      - name: Whole-recording association, legacy identities and native cold replay
        if: success() || failure()
        run: |
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --test long_corroboration_contract --test long_watch_contract
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --lib ingest::long_event_replay
      - name: Native live recording payload selection
        if: success() || failure()
        run: cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --lib rtsp::live_avc::recording::tests
      - name: Existing plain and Digest payload selection contracts
        if: success() || failure()
        run: cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --test rtsp_payload_selection_streaming
      - name: Capture and event CLI Clippy
        if: success() || failure()
        run: cargo +nightly-2026-08-31 clippy --no-deps --locked --offline -p fss-cli --bin fss-capture-rtsp --bin fss-event -- -D warnings
