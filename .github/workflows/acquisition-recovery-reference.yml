# Local DSR/direct receipts via scripts/qualify.sh are authoritative. GitHub-hosted execution is supplementary only.
# Supplementary native fixture feedback, never a substitute for DSR qualification.
name: Acquisition recovery reference

on:
  push:
    branches: [main]
    paths:
      - 'crates/fss-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/e2e/acquisition_recovery.sh'
      - '.github/workflows/acquisition-recovery-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Provision the pinned compiler
        run: bash scripts/bootstrap_toolchain.sh
      - name: Execute repository-owned Rust lane
        run: bash scripts/qualify.sh --lane rust --receipt-dir "${{ runner.temp }}/qualification-receipt"
      - name: Exercise acquisition and cold recovery contracts
        run: bash scripts/e2e/acquisition_recovery.sh
