name: agent source snapshot next

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-source-snapshot-next.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-source-snapshot-next
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact source tree
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          printf 'commit_sha=%s\ntree_sha=%s\n' "$sha" "$tree" > SOURCE_SNAPSHOT.env
          git archive --format=tar.gz --prefix=franken_surveillance_system/ -o "franken-surveillance-system-${sha}.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: franken-surveillance-system-${{ github.sha }}
          path: |
            SOURCE_SNAPSHOT.env
            franken-surveillance-system-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1
