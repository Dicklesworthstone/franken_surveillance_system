# Local DSR/direct receipts are authoritative. GitHub-hosted execution is supplementary only.
name: Native AVC and HEVC supervision

on:
  push:
    branches: [main]
    paths:
      - 'crates/fss-reference/src/rtsp/**'
      - 'crates/fss-reference/tests/supervised_hevc_recording_contract.rs'
      - 'crates/fss-reference/tests/automatic_avc_keepalive_contract.rs'
      - 'crates/fss-reference/tests/live_hevc_recording_contract.rs'
      - 'crates/fss-reference/tests/hevc_recording_support/**'
      - 'crates/fss-packet/**'
      - 'scripts/check_native_supervision.sh'
      - '.github/workflows/native-supervision.yml'
  workflow_dispatch:
    inputs:
      offline_bundle:
        description: Retain exact tracked source and installed native compiler for offline reproduction
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_NET_OFFLINE: 'true'
      RUSTUP_AUTO_INSTALL: '0'
      # A main-branch commit can explicitly request the same offline bundle as dispatch.
      FSS_SUPERVISION_OFFLINE_BUNDLE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.offline_bundle) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[offline-supervision]'))) && '1' || '0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Bootstrap the pinned compiler
        run: bash scripts/bootstrap_toolchain.sh
      - name: Execute repository-owned Rust lane
        run: bash scripts/qualify.sh --lane rust --receipt-dir "${{ runner.temp }}/qualification-receipt"
      - name: Native ownership, recovery and source-custody contracts
        env:
          FSS_SUPERVISION_EVIDENCE_DIR: ${{ runner.temp }}/native-supervision
        run: bash scripts/check_native_supervision.sh
      - name: Retain exact logs and separate formatter suggestions
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-supervision-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-supervision
          retention-days: 7
          if-no-files-found: error
