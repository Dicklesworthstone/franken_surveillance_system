# Temporary bounded reconciliation helper. Local DSR receipts remain release authority.
name: one-shot hydration hardening reconciliation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fss-one-shot-hydration-reconcile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fss-hydration-reconcile-main
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact patch series
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fss-patches.b64 <<'B64'
          
          B64
          tr -d '[:space:]' < /tmp/fss-patches.b64 | base64 -d > /tmp/fss-patches.tar.gz
          mkdir -p /tmp/fss-patches
          tar -xzf /tmp/fss-patches.tar.gz -C /tmp/fss-patches
          ls -l /tmp/fss-patches
      - name: Reconcile continuation compilation
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/fss-patches/0001-*.patch
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          git diff --check --cached
          git config user.name "Jeff Emanuel"
          git config user.email "35050222+Dicklesworthstone@users.noreply.github.com"
          git commit -m "fix(hydration): reconcile continuation contract compilation"
          git push origin HEAD:main
      - name: Harden core hydration policy and proof closure
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/fss-patches/0002-*.patch
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo test -p fss-core --all-targets
          git diff --check --cached
          git add -A
          git commit -m "fix(hydration): revalidate proof policy and cursor lineage"
          git push origin HEAD:main
      - name: Enforce exact reference hydration catalog semantics
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/fss-patches/0003-*.patch
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo run -q -p fss-cli --bin fss-hydration-rehearsal -- success > /tmp/hydration-success-1.ndjson
          cargo run -q -p fss-cli --bin fss-hydration-rehearsal -- success > /tmp/hydration-success-2.ndjson
          cmp /tmp/hydration-success-1.ndjson /tmp/hydration-success-2.ndjson
          cargo run -q -p fss-cli --bin fss-hydration-rehearsal -- expired > /tmp/hydration-expired-1.ndjson
          cargo run -q -p fss-cli --bin fss-hydration-rehearsal -- expired > /tmp/hydration-expired-2.ndjson
          cmp /tmp/hydration-expired-1.ndjson /tmp/hydration-expired-2.ndjson
          git diff --check --cached
          git add -A
          git commit -m "fix(reference): enforce exact hydration catalog semantics"
          git push origin HEAD:main
