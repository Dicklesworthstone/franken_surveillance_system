name: one-shot hydration reconciliation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fss-one-shot-hydration-reconcile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fss-one-shot-hydration-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute repository-owned reconciliation
        run: python3 scripts/fss_one_shot_hydration_reconcile.py
