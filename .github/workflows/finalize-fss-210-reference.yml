            "release_authority": "none; local DSR remains authoritative"
          }
          JSON
          rm -f proofs/dev/FSS-210-compile-failure.log
          rm -f \
            .github/workflows/mark-fss-210.yml \
            .github/workflows/validate-fss-210.yml \
            .github/workflows/normalize-fss-210-api.yml \
            .github/workflows/repair-fss-210.yml \
