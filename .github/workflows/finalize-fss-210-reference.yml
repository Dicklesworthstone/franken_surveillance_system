      - name: Commit the qualified tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "agent: finalize FSS-210 reference hydration slice"
          git push origin HEAD:main
      - name: Upload diagnostics on failure
        if: failure()
