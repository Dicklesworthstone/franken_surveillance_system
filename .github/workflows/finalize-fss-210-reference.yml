name: finalize-fss-210-reference

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-fss-210-reference.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fss-qualification-bot"
          git config user.email "fss-qualification-bot@users.noreply.github.com"
          git pull --rebase origin main
      - name: Apply idempotent source repairs and validation hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("crates/fss-core/src/hydration.rs")
          text = root.read_text()
          text = text.replace(
              "    LedgerAnchor, RecoveryClass, SessionId, TimestampNs,\n",
              "    LedgerAnchor, SessionId, TimestampNs,\n",
          )
          root.write_text(text)

          error = Path("crates/fss-core/src/hydration/error.rs")
          error.write_text('''use super::*;

/// Stable hydration failures with deterministic machine-readable codes.
#[derive(Clone, Debug, Eq, PartialEq)]
pub enum HydrationError {
    /// Shared semantic contract failure.
    Contract(ContractError),
    /// Stable handle identity was presented with a different immutable subject.
    HandleRebound,
    /// The exact descriptor revision is unknown.
    DescriptorNotFound,
    /// The requested level is not published for this subject.
    LevelUnavailable,
    /// Required read capability is absent.
    CapabilityDenied,
    /// Required privacy class is absent.
    PrivacyDenied,
    /// H4 purpose or debugging grant is insufficient.
    LaboratoryGrantRequired,
    /// No permitted level fits the declared full resource budget.
    BudgetExceeded,
    /// A progressive cursor belongs to another handle, session, basis, or position.
    WrongContinuation,
}

impl HydrationError {
    /// Returns the stable machine-readable code.
    #[must_use]
    pub fn code(&self) -> &'static str {
        match self {
            Self::Contract(error) => error.code(),
            Self::HandleRebound => "semantic_handle_rebound",
            Self::DescriptorNotFound => "semantic_handle_descriptor_not_found",
            Self::LevelUnavailable => "hydration_level_unavailable",
            Self::CapabilityDenied => "hydration_capability_denied",
            Self::PrivacyDenied => "hydration_privacy_denied",
            Self::LaboratoryGrantRequired => "hydration_laboratory_grant_required",
            Self::BudgetExceeded => "hydration_budget_exceeded",
            Self::WrongContinuation => "hydration_wrong_continuation",
        }
    }
}

impl fmt::Display for HydrationError {
    fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
        formatter.write_str(self.code())
    }
}

impl std::error::Error for HydrationError {
    fn source(&self) -> Option<&(dyn std::error::Error + 'static)> {
        match self {
            Self::Contract(error) => Some(error),
            Self::HandleRebound
            | Self::DescriptorNotFound
            | Self::LevelUnavailable
            | Self::CapabilityDenied
            | Self::PrivacyDenied
            | Self::LaboratoryGrantRequired
            | Self::BudgetExceeded
            | Self::WrongContinuation => None,
        }
    }
}

impl From<ContractError> for HydrationError {
    fn from(value: ContractError) -> Self {
        Self::Contract(value)
    }
}

impl From<ContinuationError> for HydrationError {
    fn from(_value: ContinuationError) -> Self {
        Self::WrongContinuation
    }
}
''')

          reference = Path("crates/fss-reference/src/hydration.rs")
          text = reference.read_text()
          text = text.replace("    pub const fn new() -> Self {", "    pub fn new() -> Self {")
          text = text.replace(
              "                    first_failure.get_or_insert(error);",
              "                    if first_failure.is_none() {\n                        first_failure = Some(error);\n                    }",
          )
          continuation = Path("crates/fss-core/src/continuation.rs").read_text()
          if "pub cursor_digest:" in continuation:
              text = text.replace(
                  ".map(ContinuationCursor::cursor_digest)",
                  ".map(|cursor| cursor.cursor_digest)",
              )
          elif "fn cursor_digest(" in continuation:
              text = text.replace(
                  ".map(|cursor| cursor.cursor_digest)",
                  ".map(ContinuationCursor::cursor_digest)",
              )
          reference.write_text(text)

          tests = Path("crates/fss-reference/src/hydration_tests.rs")
          text = tests.read_text()
          text = re.sub(r"\bfn handle\(", "fn make_handle(", text)
          text = re.sub(r"\bhandle\((?=\d)", "make_handle(", text)
          tests.write_text(text)

          request = Path("crates/fss-core/src/hydration/request.rs")
          text = request.read_text()
          marker = "if let Some(cursor) = &self.continuation {"
          if "if self.allow_lower_level {" not in text.split(marker, 1)[1].split("cursor.validate_at", 1)[0]:
              text = text.replace(
                  marker,
                  marker + "\n            if self.allow_lower_level {\n                return Err(HydrationError::WrongContinuation);\n            }",
                  1,
              )
          request.write_text(text)

          receipt = Path("crates/fss-core/src/hydration/receipt.rs")
          text = receipt.read_text()
          needle = "                    || !self.proof_roots.contains(&artifact.payload_digest)\n                    || !self.proof_roots.contains(&artifact.artifact_digest)"
          replacement = needle + "\n                    || !self.proof_roots.contains(&handle.subject_digest)\n                    || (level < request.requested_level && !request.allow_lower_level)\n                    || (request.continuation.is_some() && level != request.requested_level)"
          if "request.continuation.is_some() && level != request.requested_level" not in text:
              text = text.replace(needle, replacement)
          receipt.write_text(text)
          PY
          chmod +x scripts/beads_mark.py
          cargo fmt --all
      - name: Compile every workspace target
        run: cargo check --workspace --all-targets
      - name: Deny Clippy warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run all Rust tests
        run: cargo test --workspace
      - name: Run all Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Update bead, registries, status, and retained development proof
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse HEAD^{tree})"
          python3 scripts/beads_mark.py \
            --external-ref FSS-210 \
            --status in_progress \
            --author repository-agent \
            --comment "Deterministic reference vertical slice implemented and workspace-qualified: immutable semantic handles, versioned descriptors, contiguous H0-H4 ladders, exact request/receipt/artifact binding, privacy/capability/full-budget clamps, qualification-only H4, typed unavailable outcomes, monotone continuations, deterministic retries, schemas, and human/machine registries. This bead remains in progress because production object-plane hydration, protocol-surface parity, broader fault/cancellation campaigns, QL-AGENT-001, GATE-115, and local DSR release proof are not yet complete."
          python3 - <<'PY'
          from pathlib import Path

          def append_once(path: str, marker: str, block: str) -> None:
              file = Path(path)
              text = file.read_text()
              if marker not in text:
                  file.write_text(text.rstrip() + "\n\n" + block.strip() + "\n")

          append_once(
              "README.md",
              "<!-- FSS-210-REFERENCE -->",
              '''<!-- FSS-210-REFERENCE -->
          ## Semantic handles and progressive evidence hydration

          The deterministic reference surface now supports immutable semantic handles with versioned descriptors and a contiguous `H0`–`H4` hydration ladder. Requests bind the exact subject digest, descriptor digest, `ContractBasis`, session, authority anchor, privacy classes, capabilities, full multidimensional budget, purpose, and continuation cursor. The reference hydrator returns the richest explicitly permitted level, never substitutes a derivative under the original identity, and reports expiry, deletion, corruption, privacy transformation, supersession, and non-observability as typed non-payload outcomes.

          The implementation lives in `fss-core::hydration` and `fss-reference::ReferenceHydrator`; the wire schemas live under `schemas/semantic_*hydration*.v1.json`, and the normative machine registry is `architecture/semantic_hydration.json`. This is a qualified deterministic reference slice, not yet the production object-plane hydrator or a public release claim. See `registries/SEMANTIC_HYDRATION.md` for the exact identity, authorization, fallback, continuation, and proof rules.
          ''',
          )
          append_once(
              "CHANGELOG.md",
              "<!-- FSS-210-CHANGELOG -->",
              '''<!-- FSS-210-CHANGELOG -->
          ### 2026-09-03 — FSS-210 deterministic semantic hydration reference slice

          - Added immutable semantic-handle identities separated from versioned availability, retention, capability, privacy, cost, and authority descriptors.
          - Added contiguous `H0`–`H4` hydration contracts, exact artifacts, requests, proof-bearing receipts, and hydration-scoped continuation cursors.
          - Added a deterministic reference hydrator with exact retry identity, richest-authorized direct fallback, strict continuation monotonicity, qualification/debugging clamps for `H4`, and explicit stale/deleted/expired/corrupt/privacy-transformed/not-observable outcomes.
          - Added adversarial regressions for rebinding, unrooted artifacts, stale descriptors, privacy/capability denial, budget degradation, H4 laundering, expiry, deletion, and artifact tampering.
          - Added wire schemas, machine and human registries, an atomic external-reference bead updater, and retained supplementary qualification evidence.
          ''',
          )
          append_once(
              "IMPLEMENTATION_STATUS.md",
              "<!-- FSS-210-STATUS -->",
              '''<!-- FSS-210-STATUS -->
          ## FSS-210 semantic hydration — deterministic reference slice implemented

          **State:** in progress; deterministic reference implementation and supplementary workspace qualification complete.

          Implemented: immutable subject-bound handles, monotone descriptor revisions, contiguous `H0`–`H4` policy, typed artifacts/requests/receipts, exact contract/anchor/session/subject binding, privacy and capability projection, full resource-budget accounting, direct lower-level fallback, strict progressive cursors, qualification/debugging `H4` controls, deterministic retry, explicit unavailable outcomes, schemas, and machine/human registries.

          Not complete: production object-store publication and retrieval, complete privacy-engine integration, Rust API/CLI/MCP/TUI/report transcript equivalence, disconnect/cancellation/crash campaigns, multi-agent schedules, aggregate `TEST-AGENT-*` evidence, `QL-AGENT-001`, `GATE-115`, and local DSR release authority. No production-readiness or release claim follows from this reference slice.
          ''',
          )
          append_once(
              "ROADMAP.md",
              "<!-- FSS-210-ROADMAP -->",
              '''<!-- FSS-210-ROADMAP -->
          ## Immediate agent-control continuation after the FSS-210 reference slice

          1. Bind semantic-handle descriptors and hydration artifacts to the production object plane with child-first/root-last publication and graph-complete deletion semantics.
          2. Project real capability and privacy-policy decisions into every hydration request and receipt, including transformed-derivative discovery without identity substitution.
          3. Expose one transcript-equivalent hydration operation across Rust API, CLI, MCP, TUI, reports, continuations, and handoffs.
          4. Add crash, cancellation, disconnect, stale-anchor, retention-race, descriptor-revision, corrupt-object, and concurrent-session campaigns.
          5. Aggregate task-quality, safety, privacy, latency, resource, and operator-burden evidence under `QL-AGENT-001`, `GATE-115`, and the local DSR release root.
          ''',
          )
          append_once(
              "registries/SCHEMAS.md",
              "<!-- FSS-210-SCHEMAS -->",
              '''<!-- FSS-210-SCHEMAS -->
          ## FSS-210 semantic hydration schemas

          | Schema | Semantic owner | Current implementation |
          |---|---|---|
          | `semantic_handle.v1.json` | `fss-agent-core` | immutable handle plus versioned descriptor |
          | `semantic_hydration_artifact.v1.json` | `fss-agent-core` | exact bounded H-level artifact |
          | `semantic_hydration_request.v1.json` | `fss-agent-core` | exact authorization and budget request |
          | `semantic_hydration_receipt.v1.json` | `fss-agent-core` | proof-bearing response and invalidators |
          | `agent_continuation_cursor.v1.json` | `fss-agent-session` | exact hydration/delta/expansion continuation |
          ''',
          )
          append_once(
              "registries/TESTS.md",
              "<!-- FSS-210-TESTS -->",
              '''<!-- FSS-210-TESTS -->
          ## FSS-210 deterministic reference qualification

          The `fss-core` and `fss-reference` suites cover immutable handle identity, descriptor revision, contiguous ladders, request/cursor binding, payload integrity, deterministic retry, progressive hydration, richest-permitted budget fallback, privacy and capability denial, H4 grant enforcement, expiry/deletion, stale descriptors, rebinding, and unrooted artifacts. These tests are reference evidence only; the production fault, multi-agent, cross-surface, QL-AGENT-001, and GATE-115 families remain open.
          ''',
          )
          PY
          mkdir -p proofs/dev
          cat > proofs/dev/FSS-210-reference-qualification.json <<JSON
          {
            "schema": "fss.development_qualification.v1",
