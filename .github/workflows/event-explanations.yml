# Focused supplementary native feedback; local repository-owned DSR qualification remains authoritative.
# A separate queue avoids waiting for the broad reference suite before testing explanation changes.
name: supplementary event explanation checks

on:
  push:
    branches: [main]
    paths:
      - 'crates/fss-cli/src/event_counterfactual.rs'
      - 'crates/fss-cli/src/event_counterfactual/**'
      - 'crates/fss-cli/src/orient_cmd.rs'
      - 'crates/fss-cli/src/orient_cmd/**'
      - 'crates/fss-cli/src/bin/fss-mcp.rs'
      - 'crates/fss-cli/src/bin/fss_mcp/**'
      - 'crates/fss-cli/src/bin/fss-event/replay.rs'
      - 'crates/fss-cli/src/bin/fss-event/replay/**'
      - 'crates/fss-cli/src/sources_query_cmd.rs'
      - 'crates/fss-cli/src/localizations_query_cmd.rs'
      - 'crates/fss-cli/src/lib.rs'
      - 'crates/fss-cli/tests/event_counterfactual_cli_contract.rs'
      - 'crates/fss-cli/tests/explain_fusion_cli_contract.rs'
      - 'crates/fss-cli/tests/event_changes_cli_contract.rs'
      - 'crates/fss-cli/tests/sources_query_cli_contract.rs'
      - 'crates/fss-cli/tests/localizations_query_cli_contract.rs'
      - 'crates/fss-cli/tests/retained_localization_cli.rs'
      - 'crates/fss-cli/tests/long_event_replay_cli.rs'
      - 'crates/fss-cli/tests/long_event_replay_cli/**'
      - 'crates/fss-reference/src/retained_source.rs'
      - 'crates/fss-reference/src/alert.rs'
      - 'crates/fss-reference/src/alert_tests.rs'
      - 'crates/fss-reference/src/agent_event_changes.rs'
      - 'crates/fss-reference/src/agent_event_changes/**'
      - 'crates/fss-reference/src/agent_orient.rs'
      - 'crates/fss-reference/src/agent_orient/**'
      - 'crates/fss-reference/src/agent_sources.rs'
      - 'crates/fss-reference/src/agent_sources/**'
      - 'crates/fss-reference/src/agent_localizations.rs'
      - 'crates/fss-reference/src/agent_localizations/**'
      - 'crates/fss-reference/src/ingest/twin_localization/retained.rs'
      - 'crates/fss-reference/src/ingest/twin_localization/retained/**'
      - 'crates/fss-reference/src/ingest/long_event_replay.rs'
      - 'crates/fss-reference/src/ingest/long_event_replay/**'
      - 'crates/fss-reference/src/ingest/recorded_corroboration/streaming/geometry.rs'
      - 'crates/fss-reference/tests/agent_event_changes_contract.rs'
      - 'crates/fss-reference/tests/agent_report_catalog_contract.rs'
      - 'crates/fss-reference/tests/agent_sources_contract.rs'
      - 'crates/fss-reference/tests/agent_sources_contract/**'
      - 'crates/fss-reference/tests/agent_localizations_contract.rs'
      - 'crates/fss-reference/tests/twin_localization_query_support/**'
      - 'crates/fss-reference/tests/long_event_replay_immutable_contract.rs'
      - 'crates/fss-reference/tests/long_event_replay_immutable_contract/**'
      - 'crates/fss-fusion/**'
      - 'schemas/*counterfactual*.json'
      - 'schemas/agent_localizations_query.v1.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/bootstrap_toolchain.sh'
      - '.github/workflows/event-explanations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fss-event-explanations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  event-explanations:
    name: pinned immutable event explanations and source-loss scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Provision pinned test toolchain
        run: bash scripts/bootstrap_toolchain.sh
      - name: Verify retained localization custody and discovery
        if: success() || failure()
        run: cargo +nightly-2026-08-31 test --locked --offline --no-fail-fast -p fss-reference --test agent_localizations_contract --test recorded_twin_localization_contract
      - name: Verify localization CLI and MCP compatibility
        if: success() || failure()
        run: cargo +nightly-2026-08-31 test --locked --offline --no-fail-fast -p fss-cli --test localizations_query_cli_contract --test retained_localization_cli
      - name: Verify source-loss mathematics and complete artifact projection
        if: success() || failure()
        run: |
          scenario_exit=0
          cargo +nightly-2026-08-31 test --locked --offline -p fss-cli --lib event_counterfactual:: || scenario_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-cli --lib orient_cmd::what_if:: || scenario_exit=1
          exit "$scenario_exit"
      - name: Verify committed alert preparation and dispatch eligibility
        if: success() || failure()
        run: |
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --lib alert_tests::
      - name: Verify immutable lineage, source inventory and whole-recording custody
        if: success() || failure()
        run: |
          read_exit=0
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --lib agent_orient::tests || read_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --lib ingest::long_event_replay:: || read_exit=1
          cargo +nightly-2026-08-31 test --locked --offline --no-fail-fast -p fss-reference --test agent_event_changes_contract --test agent_report_catalog_contract --test agent_sources_contract --test long_event_replay_immutable_contract || read_exit=1
          exit "$read_exit"
      - name: Verify exact CLI and MCP explanation compatibility
        if: success() || failure()
        run: |
          transport_exit=0
          cargo +nightly-2026-08-31 test --locked --offline -p fss-cli --bin fss-event replay:: || transport_exit=1
          cargo +nightly-2026-08-31 test --locked --offline --no-fail-fast -p fss-cli --bin fss-mcp --test event_counterfactual_cli_contract --test explain_fusion_cli_contract --test event_changes_cli_contract --test explain_support_cli_contract --test explain_custody_cli --test sources_query_cli_contract --test long_event_replay_cli || transport_exit=1
          exit "$transport_exit"
      - name: Execute repository-owned Rust qualification lane
        if: success() || failure()
        run: bash scripts/qualify.sh --lane rust
