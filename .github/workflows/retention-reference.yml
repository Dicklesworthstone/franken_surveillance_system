# Supplementary reference execution, never a replacement for local DSR qualification.
name: retention reference checks
on:
  push:
    branches: [main]
    paths:
      - 'crates/fss-reference/src/deletion.rs'
      - 'crates/fss-reference/src/deletion/**'
      - 'crates/fss-reference/tests/retention_contract.rs'
      - 'crates/fss-cli/src/bin/fss-event/delete.rs'
      - 'crates/fss-cli/tests/retention_cli_contract.rs'
      - 'scripts/check_retention_reference.sh'
      - '.github/workflows/retention-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retention-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install repository-pinned toolchain
        shell: bash
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
      - name: Run focused reference checks
        run: bash scripts/check_retention_reference.sh
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retention-reference-${{ github.sha }}
          path: out/retention-reference/
          if-no-files-found: warn
          retention-days: 7
