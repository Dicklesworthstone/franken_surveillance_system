# Retention/deletion trigger for the portable qualification specification.
# Local DSR/direct receipts are authoritative. GitHub-hosted execution is supplementary only;
# the focused checks live in scripts/check_retention_reference.sh for local use.
name: retention reference checks
on:
  push:
    branches: [main]
    paths:
      - 'crates/fss-reference/src/deletion.rs'
      - 'crates/fss-reference/src/deletion/**'
      - 'crates/fss-reference/tests/retention_contract.rs'
      - 'crates/fss-cli/src/bin/fss-event/delete.rs'
      - 'crates/fss-cli/tests/retention_cli_contract.rs'
      - 'scripts/check_retention_reference.sh'
      - '.github/workflows/retention-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retention-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    name: retention-relevant Rust contract
    runs-on: [self-hosted, fss-linux-amd64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Execute repository-owned Rust lane
        run: bash scripts/qualify.sh --lane rust
