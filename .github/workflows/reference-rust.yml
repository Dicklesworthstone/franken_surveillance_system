# Supplementary compilation and regression feedback; native DSR qualification remains authoritative.
name: supplementary reference Rust checks

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/reference-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fss-reference-rust-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reference-tests:
    name: pinned-nightly reference tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Provision pinned test toolchain
        run: bash scripts/bootstrap_toolchain.sh
      - name: Verify owned runtime and recoverable effect transitions
        run: cargo +nightly-2026-08-31 test --no-fail-fast --locked --offline -p fss-runtime --all-targets --all-features
      - name: Verify event replay admission and approved recovery rehearsal
        if: success() || failure()
        run: cargo +nightly-2026-08-31 test --no-fail-fast --locked --offline -p fss-cli --bin fss-event --bin fss-replay-dwell --test agent_rehearsal_contract
      - name: Verify owned multipart upload and durable restart recovery
        if: success() || failure()
        run: cargo +nightly-2026-08-31 test --no-fail-fast --locked --offline -p fss-object --test multipart_family --test uploader_family --test durable_upload_contract --test recovered_upload_authority --test upload_journal_namespace
      - name: Verify read-only upload inspection in a fresh process
        if: success() || failure()
        run: cargo +nightly-2026-08-31 test --locked --offline -p fss-cli --test archive_upload_journal_cli
      - name: Verify original and reviewed event footage export and offline custody
        if: success() || failure()
        run: |
          export_exit=0
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --test original_media_export_contract || export_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-cli --bin fss-export --bin fss-review --test rtsp_event_media_export_cli || export_exit=1
          exit "$export_exit"
      - name: Verify deployment status inventory and bounded admission
        run: |
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --lib deployment_status::tests
          cargo +nightly-2026-08-31 test --locked --offline -p fss-cli --test status_real_root
      - name: Verify exact continuation compatibility
        run: cargo +nightly-2026-08-31 test --locked --offline -p fss-core --lib continuation::tests
      - name: Verify bounded context expansion bindings
        run: cargo +nightly-2026-08-31 test --locked --offline -p fss-core --test context_expansion_binding_contract
      - name: Verify native deployment and agent backup recovery
        run: cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --test deployment_backup_contract
      - name: Verify backup operator commands and historical inspection
        run: cargo +nightly-2026-08-31 test --locked --offline -p fss-cli --test deployment_backup_cli
      - name: Verify existing session and restored-effect boundaries
        run: 'cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --lib deployment_session::'
      - name: Verify exclusive writer lifetimes and recovery
        if: success() || failure()
        run: |
          cargo +nightly-2026-08-31 test --locked --offline -p fss-object --test staging_spool_contract --test staging_spool_io_faults
          cargo +nightly-2026-08-31 test --locked --offline -p fss-publication --test lock_lifetime_contract --test root_last_publication_contract --test local_publication_io_faults
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --test reference_deployment_recovery_contract --test reference_deployment_contract --test activity_belief_contract
      - name: Verify fresh camera liveness and stale-heartbeat handling
        if: success() || failure()
        run: |
          discovery_exit=0
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --test discovery_watchdog_contract || discovery_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --lib discovery::retained_liveness || discovery_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --lib network_outage_and_rediscovery_cannot_reuse_a_prior_absence_witness || discovery_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --lib overlapping_prior_liveness_cannot_be_hidden_by_a_new_coverage_basis || discovery_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-cli --bin fss-discover || discovery_exit=1
          exit "$discovery_exit"
      - name: Verify retained native frame localization and owner command
        if: success() || failure()
        run: |
          localization_exit=0
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --test recorded_twin_localization_contract || localization_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-cli --bin fss-file --test retained_localization_cli || localization_exit=1
          exit "$localization_exit"
      - name: Verify whole-recording dwell and retained detector replay
        if: success() || failure()
        run: |
          dwell_exit=0
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --lib ingest::long_dwell::tests || dwell_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --lib ingest::long_dwell_replay::tests || dwell_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --lib ingest::long_event_replay:: || dwell_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-cli --test watch_stream_detector_cli --test watch_stream_dwell_cli --test long_event_replay_cli || dwell_exit=1
          exit "$dwell_exit"
      - name: Verify bounded event queries
        run: cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --lib agent_query::tests
      - name: Verify protected deployment orientation
        run: cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --lib agent_orient::tests
      - name: Verify bounded follow waits and exact CLI/MCP deltas
        run: |
          follow_exit=0
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --lib agent_follow:: || follow_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --test follow_wait_partitioned_custody_contract || follow_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --test follow_replay_contract || follow_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --test follow_session_delivery_contract || follow_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --lib agent_session::checkpoint::journal::follow::tests || follow_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-cli --lib follow_cmd:: || follow_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-cli --bin fss-mcp || follow_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-cli --test follow_cli_contract || follow_exit=1
          cargo +nightly-2026-08-31 test --locked --offline -p fss-cli --test follow_subscription_cli_contract || follow_exit=1
          cargo +nightly-2026-08-31 test --no-fail-fast --locked --offline -p fss-cli --test session_cli_contract --test mcp_cli_contract --test mcp_session_lifecycle_contract --test investigate_cli_contract --test mcp_investigation_contract --test mcp_coordination_contract --test work_claim_cli_contract --test finding_cli_contract --test mcp_control_contract --test agent_effect_cli_contract --test mcp_feedback_contract || follow_exit=1
          exit "$follow_exit"
      - name: Verify query CLI, library and MCP parity
        if: success() || failure()
        run: cargo +nightly-2026-08-31 test --locked --offline -p fss-cli --test query_surface_contract
      - name: Verify complete RTSP catalog custody and legacy window imports
        if: success() || failure()
        run: cargo +nightly-2026-08-31 test --locked --offline -p fss-reference --test rtsp_catalog_import_contract --test rtsp_import_contract
      - name: Verify RTSP catalog and window operator commands
        if: success() || failure()
        run: cargo +nightly-2026-08-31 test --locked --offline -p fss-cli --test rtsp_catalog_import_cli --test rtsp_import_cli --bin fss-import-rtsp
      - name: Compile and execute native reference contracts
        run: cargo +nightly-2026-08-31 test --locked --offline --workspace --all-targets
      - name: Execute repository-owned Rust qualification lane
        run: bash scripts/qualify.sh --lane rust
      - name: Check bounded follow source formatting
        if: always()
        run: >-
          rustup run nightly-2026-08-31 rustfmt --check --edition 2024 --config skip_children=true
          crates/fss-object/src/lib.rs
          crates/fss-object/src/spool/capability.rs
          crates/fss-object/src/spool/mod.rs
          crates/fss-object/tests/staging_spool_io_faults.rs
          crates/fss-publication/src/local/mod.rs
          crates/fss-publication/tests/lock_lifetime_contract.rs
          crates/fss-reference/src/deployment_session.rs
          crates/fss-reference/src/reference_deployment.rs
          crates/fss-reference/tests/reference_deployment_recovery_contract.rs
          crates/fss-reference/src/agent_follow.rs
          crates/fss-reference/src/agent_follow/replay.rs
          crates/fss-reference/tests/follow_replay_contract.rs
          crates/fss-reference/src/deployment_session/follow.rs
          crates/fss-reference/src/agent_session/checkpoint/journal/follow.rs
          crates/fss-reference/src/agent_session/checkpoint/journal/follow/tests.rs
          crates/fss-reference/tests/follow_session_delivery_contract.rs
          crates/fss-cli/src/follow_cmd/subscription.rs
          crates/fss-cli/tests/follow_subscription_cli_contract.rs
          crates/fss-reference/src/agent_follow/wait.rs
          crates/fss-reference/src/agent_follow/wait/custody.rs
          crates/fss-reference/src/agent_follow/wait/custody/recorded.rs
          crates/fss-reference/src/agent_follow/wait/tests.rs
          crates/fss-reference/tests/follow_wait_partitioned_custody_contract.rs
          crates/fss-cli/src/follow_cmd.rs
          crates/fss-cli/src/follow_cmd/wait.rs
          crates/fss-cli/src/follow_cmd/wait/tests.rs
          crates/fss-cli/src/fss_cmd.rs
          crates/fss-cli/src/session_cmd.rs
          crates/fss-cli/src/bin/fss-mcp.rs
          crates/fss-cli/tests/mcp_session_lifecycle_contract.rs
          crates/fss-cli/src/orient_cmd.rs
          crates/fss-cli/src/bin/fss_mcp/server.rs
          crates/fss-cli/src/bin/fss_mcp/json.rs
          crates/fss-cli/src/bin/fss_mcp/investigate.rs
          crates/fss-cli/src/bin/fss_mcp/coordination.rs
          crates/fss-cli/src/bin/fss_mcp/control.rs
          crates/fss-cli/src/bin/fss_mcp/feedback.rs
          crates/fss-cli/tests/mcp_feedback_contract.rs
          crates/fss-cli/src/effect_cmd.rs
          crates/fss-reference/src/deployment_session/plan.rs
          crates/fss-cli/tests/mcp_control_contract.rs
          crates/fss-cli/tests/agent_effect_cli_contract.rs
          crates/fss-cli/tests/agent_rehearsal_contract.rs
          crates/fss-cli/tests/mcp_investigation_contract.rs
          crates/fss-cli/tests/mcp_investigation_contract/wire.rs
          crates/fss-cli/tests/mcp_coordination_contract.rs
          crates/fss-cli/tests/finding_cli_contract.rs
          crates/fss-reference/src/deployment_session/findings.rs
          crates/fss-cli/tests/follow_cli_contract.rs
          crates/fss-core/tests/context_expansion_binding_contract.rs
      - name: Check formatting of changed reference sources
        if: always()
        run: rustup run nightly-2026-08-31 rustfmt --check --edition 2024 --config skip_children=true crates/fss-cli/src/bin/fss-backup.rs crates/fss-cli/src/bin/fss-backup/agent_report.rs crates/fss-cli/src/bin/fss-import-rtsp.rs crates/fss-cli/src/bin/fss-import-rtsp/driver.rs crates/fss-cli/src/bin/fss-import-rtsp/plan.rs crates/fss-cli/src/bin/fss-import-rtsp/tests.rs crates/fss-cli/tests/deployment_backup_cli.rs crates/fss-cli/tests/query_surface_contract.rs crates/fss-cli/tests/rtsp_catalog_import_cli.rs crates/fss-core/src/agent_query_plan.rs crates/fss-core/src/continuation.rs crates/fss-reference/examples/fingerprint_lan.rs crates/fss-reference/src/agent_orient.rs crates/fss-reference/src/agent_orient/tests.rs crates/fss-reference/src/agent_query.rs crates/fss-reference/src/agent_query/tests.rs crates/fss-reference/src/agent_session/checkpoint/journal.rs crates/fss-reference/src/agent_session/checkpoint/journal/workspace.rs crates/fss-reference/src/agent_session/workspace.rs crates/fss-reference/src/deployment_backup.rs crates/fss-reference/src/deployment_backup/agent.rs crates/fss-reference/src/deployment_backup/io.rs crates/fss-reference/src/deployment_backup/manifest.rs crates/fss-reference/src/deployment_backup/snapshot.rs crates/fss-reference/src/deployment_backup/transfer.rs crates/fss-reference/src/deployment_session.rs crates/fss-reference/src/ingest/file_adapter.rs crates/fss-reference/src/ingest/retained.rs crates/fss-reference/src/ingest/retained/root_binding.rs crates/fss-reference/src/ingest/rtsp_import.rs crates/fss-reference/src/ingest/rtsp_import/catalog.rs crates/fss-reference/src/ingest/rtsp_import/catalog_provenance.rs crates/fss-reference/src/ingest/rtsp_import/provenance.rs crates/fss-reference/src/ingest/rtsp_import/publication.rs crates/fss-reference/src/rtsp/recording_catalog.rs crates/fss-reference/tests/deployment_backup_contract.rs crates/fss-reference/tests/deployment_backup_contract/agent.rs crates/fss-reference/tests/recording_support/mod.rs crates/fss-reference/tests/rtsp_catalog_import_contract.rs
      - name: Check retained localization source formatting
        if: always()
        run: >-
          rustup run nightly-2026-08-31 rustfmt --check --edition 2024 --config skip_children=true
          crates/fss-reference/src/ingest/twin_localization.rs
          crates/fss-reference/src/ingest/twin_localization/receipt.rs
          crates/fss-reference/src/ingest/twin_localization/retained.rs
          crates/fss-reference/src/ingest/twin_localization/retained/wire.rs
          crates/fss-reference/tests/recorded_twin_localization/retained.rs
          crates/fss-reference/tests/recorded_twin_localization/archive_fixture.rs
          crates/fss-reference/src/ingest/mod.rs
          crates/fss-reference/tests/recorded_twin_localization_contract.rs
          crates/fss-cli/src/bin/fss-file.rs
          crates/fss-cli/src/bin/fss-file/localize.rs
          crates/fss-cli/src/bin/fss-file/localization_replay.rs
          crates/fss-cli/tests/retained_localization_cli.rs
          crates/fss-reference/tests/reference_deployment_contract.rs
      - name: Check retained liveness source formatting
        if: always()
        run: >-
          rustup run nightly-2026-08-31 rustfmt --check --edition 2024 --config skip_children=true
          crates/fss-reference/src/discovery/mod.rs
          crates/fss-reference/src/discovery/retained_liveness.rs
          crates/fss-reference/src/discovery/retained_liveness/tests.rs
          crates/fss-reference/src/reference_deployment.rs
          crates/fss-reference/src/agent_orient.rs
          crates/fss-reference/src/agent_orient/liveness.rs
          crates/fss-reference/src/meaningful_delta.rs
          crates/fss-reference/src/ingest/source_coverage/tests.rs
          crates/fss-cli/src/bin/fss-discover.rs
          crates/fss-cli/src/bin/fss-discover/liveness.rs
      - name: Check cold dwell replay source formatting
        if: always()
        run: >-
          rustup run nightly-2026-08-31 rustfmt --check --edition 2024 --config skip_children=true
          crates/fss-reference/src/ingest/long_dwell.rs
          crates/fss-reference/src/ingest/long_dwell/incremental.rs
          crates/fss-reference/src/ingest/long_dwell/tests.rs
