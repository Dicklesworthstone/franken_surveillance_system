# Local DSR/direct receipts are authoritative. GitHub-hosted execution is supplementary only.
name: Local dashboard contracts
on:
  push:
    branches: [main]
    paths:
      - 'crates/fss-cli/**'
      - 'crates/fss-reference/**'
      - 'crates/fss-core/**'
      - 'crates/fss-twin/**'
      - 'crates/fss-geometry/**'
      - 'tests/test_dashboard*'
      - 'tests/test_spatial*'
      - 'scripts/check_dashboard.sh'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_NET_OFFLINE: true
      RUSTUP_AUTO_INSTALL: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Execute repository-owned Rust lane
        run: bash scripts/qualify.sh --lane rust --receipt-dir "${{ runner.temp }}/qualification-receipt"
      - run: bash scripts/bootstrap_toolchain.sh
      - run: bash scripts/check_dashboard.sh
