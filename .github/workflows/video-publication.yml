# Local DSR/direct receipts are authoritative. GitHub-hosted execution is supplementary only.
name: Native video publication
on:
  push:
    branches: [main]
    paths:
      - 'crates/fss-cli/src/bin/fss-video*'
      - 'crates/fss-cli/src/bin/fss-video/**'
      - 'crates/fss-cli/tests/video_publication_cli.rs'
      - 'crates/fss-cli/tests/video_selection_cli.rs'
      - 'crates/fss-reference/src/ingest/**'
      - 'crates/fss-reference/tests/video_publication*'
      - '.github/workflows/video-publication.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-video-publication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_NET_OFFLINE: true
      RUSTUP_AUTO_INSTALL: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/bootstrap_toolchain.sh
      # All qualification logic lives in the repository qualifier (the video
      # publication and selection contracts are inside the workspace lanes);
      # this workflow only delegates and retains the receipt.
      - name: Execute repository-owned Rust lane
        run: bash scripts/qualify.sh --lane rust --receipt-dir "$RUNNER_TEMP/video-evidence/qualification"
      - name: Keep exact native results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-video-${{ github.sha }}
          path: ${{ runner.temp }}/video-evidence
          retention-days: 7
          if-no-files-found: error
