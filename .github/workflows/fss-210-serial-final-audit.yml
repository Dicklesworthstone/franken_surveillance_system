name: fss-210-serial-final-audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fss-210-serial-final-audit.yml

concurrency:
  group: fss-210-serial-final-audit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Allow earlier main mutators to settle
        run: sleep 90
      - name: Rebase onto the settled branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fss-qualification-bot"
          git config user.email "fss-qualification-bot@users.noreply.github.com"
          git pull --rebase origin main
      - name: Reapply idempotent source and receipt hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          error = Path("crates/fss-core/src/hydration/error.rs")
          error.write_text('''use super::*;

/// Stable hydration failures with deterministic machine-readable codes.
#[derive(Clone, Debug, Eq, PartialEq)]
pub enum HydrationError {
    /// Shared semantic contract failure.
    Contract(ContractError),
    /// Stable handle identity was presented with a different immutable subject.
    HandleRebound,
    /// The exact descriptor revision is unknown.
    DescriptorNotFound,
    /// The requested level is not published for this subject.
    LevelUnavailable,
    /// Required read capability is absent.
    CapabilityDenied,
    /// Required privacy class is absent.
    PrivacyDenied,
    /// H4 purpose or debugging grant is insufficient.
    LaboratoryGrantRequired,
    /// No permitted level fits the declared full resource budget.
    BudgetExceeded,
    /// A progressive cursor belongs to another handle, session, basis, or position.
    WrongContinuation,
}

impl HydrationError {
    /// Returns the stable machine-readable code.
    #[must_use]
    pub fn code(&self) -> &'static str {
        match self {
            Self::Contract(error) => error.code(),
            Self::HandleRebound => "semantic_handle_rebound",
            Self::DescriptorNotFound => "semantic_handle_descriptor_not_found",
            Self::LevelUnavailable => "hydration_level_unavailable",
            Self::CapabilityDenied => "hydration_capability_denied",
            Self::PrivacyDenied => "hydration_privacy_denied",
            Self::LaboratoryGrantRequired => "hydration_laboratory_grant_required",
            Self::BudgetExceeded => "hydration_budget_exceeded",
            Self::WrongContinuation => "hydration_wrong_continuation",
        }
    }
}

impl fmt::Display for HydrationError {
    fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
        formatter.write_str(self.code())
    }
}

impl std::error::Error for HydrationError {
    fn source(&self) -> Option<&(dyn std::error::Error + 'static)> {
        match self {
            Self::Contract(error) => Some(error),
            Self::HandleRebound
            | Self::DescriptorNotFound
            | Self::LevelUnavailable
            | Self::CapabilityDenied
            | Self::PrivacyDenied
            | Self::LaboratoryGrantRequired
            | Self::BudgetExceeded
            | Self::WrongContinuation => None,
        }
    }
}

impl From<ContractError> for HydrationError {
    fn from(value: ContractError) -> Self {
        Self::Contract(value)
    }
}

impl From<ContinuationError> for HydrationError {
    fn from(_value: ContinuationError) -> Self {
        Self::WrongContinuation
    }
}
''')

          root = Path("crates/fss-core/src/hydration.rs")
          text = root.read_text().replace(
              "    LedgerAnchor, RecoveryClass, SessionId, TimestampNs,\n",
              "    LedgerAnchor, SessionId, TimestampNs,\n",
          )
          root.write_text(text)

          request = Path("crates/fss-core/src/hydration/request.rs")
          text = request.read_text()
          marker = "if let Some(cursor) = &self.continuation {"
          if "if self.allow_lower_level {" not in text.split(marker, 1)[1].split("cursor.validate_at", 1)[0]:
              text = text.replace(
                  marker,
                  marker + "\n            if self.allow_lower_level {\n                return Err(HydrationError::WrongContinuation);\n            }",
                  1,
              )
          request.write_text(text)

          continuation_source = Path("crates/fss-core/src/continuation.rs").read_text()
          if "pub cursor_digest:" in continuation_source:
              parent_expr = "request.continuation.as_ref().map(|cursor| cursor.cursor_digest)"
          elif "fn cursor_digest(" in continuation_source:
              parent_expr = "request.continuation.as_ref().map(ContinuationCursor::cursor_digest)"
          else:
              raise SystemExit("ContinuationCursor exposes no exact digest")

          reference = Path("crates/fss-reference/src/hydration.rs")
          text = reference.read_text()
          text = text.replace("    pub const fn new() -> Self {", "    pub fn new() -> Self {")
          text = text.replace(
              "                    first_failure.get_or_insert(error);",
              "                    if first_failure.is_none() {\n                        first_failure = Some(error);\n                    }",
          )
          text = text.replace(
              ".map(ContinuationCursor::cursor_digest)",
              ".map(|cursor| cursor.cursor_digest)" if "pub cursor_digest:" in continuation_source else ".map(ContinuationCursor::cursor_digest)",
          )
          text = text.replace(
              ".map(|cursor| cursor.cursor_digest)",
              ".map(|cursor| cursor.cursor_digest)" if "pub cursor_digest:" in continuation_source else ".map(ContinuationCursor::cursor_digest)",
          )
          reference.write_text(text)

          tests = Path("crates/fss-reference/src/hydration_tests.rs")
          text = tests.read_text()
          text = re.sub(r"\bfn handle\(", "fn make_handle(", text)
          text = re.sub(r"\bhandle\((?=\d)", "make_handle(", text)
          tests.write_text(text)

          receipt = Path("crates/fss-core/src/hydration/receipt.rs")
          text = receipt.read_text()
          availability_marker = "        match (\n            self.availability,"
          if "let expected_availability = if request.issued_at >= handle.retention_until" not in text:
              text = text.replace(
                  availability_marker,
                  '''        let expected_availability = if request.issued_at >= handle.retention_until {
              HandleAvailability::Expired
          } else {
              handle.availability
          };
          if self.availability != expected_availability {
              return Err(ContractError::DigestMismatch.into());
          }
''' + availability_marker,
                  1,
              )
          artifact_needle = "                    || !self.proof_roots.contains(&artifact.artifact_digest)"
          if "request.continuation.is_some() && level != request.requested_level" not in text:
              text = text.replace(
                  artifact_needle,
                  artifact_needle
                  + "\n                    || !self.proof_roots.contains(&handle.subject_digest)"
                  + "\n                    || (level < request.requested_level && !request.allow_lower_level)"
                  + "\n                    || (request.continuation.is_some() && level != request.requested_level)",
                  1,
              )
          cursor_needle = "                || cursor.position != u64::from(delivered.ordinal()) + 1"
          if "cursor.selection_witness != handle.ladder_policy_digest()" not in text:
              text = text.replace(
                  cursor_needle,
                  cursor_needle
                  + "\n                || cursor.selection_witness != handle.ladder_policy_digest()"
                  + "\n                || cursor.source_digest != handle.descriptor_digest"
                  + "\n                || cursor.high_water_mark"
                  + "\n                    != u64::from("
                  + "\n                        handle"
                  + "\n                            .maximum_level()"
                  + "\n                            .ok_or(HydrationError::LevelUnavailable)?"
                  + "\n                            .ordinal(),"
                  + "\n                    ) + 1"
                  + "\n                || cursor.expires_at != handle.retention_until"
                  + f"\n                || cursor.previous_cursor_digest != {parent_expr}",
                  1,
              )
          continuation_marker = "        if let Some(cursor) = &self.continuation {"
          if "let richer_level_remains = self.delivered_level.is_some_and" not in text:
              text = text.replace(
                  continuation_marker,
                  '''        let richer_level_remains = self.delivered_level.is_some_and(|delivered| {
              delivered
                  .successor()
                  .zip(handle.maximum_level())
                  .is_some_and(|(next, maximum)| next <= maximum)
          });
          if self.availability == HandleAvailability::Available
              && self.continuation.is_some() != richer_level_remains
          {
              return Err(ContractError::EvidenceRequired.into());
          }
''' + continuation_marker,
                  1,
              )
          for required in (
              "expected_availability",
              "request.continuation.is_some() && level != request.requested_level",
              "cursor.selection_witness != handle.ladder_policy_digest()",
              "richer_level_remains",
          ):
              if required not in text:
                  raise SystemExit(f"missing receipt hardening: {required}")
          receipt.write_text(text)

          binary = Path("crates/fss-cli/src/bin/fss-hydration-rehearsal.rs")
          text = binary.read_text()
          text = text.replace("use std::fmt::Write as _;\n", "")
          text = text.replace(
              "model_calls: u32::from(level >= HydrationLevel::H2),",
              "model_calls: if level >= HydrationLevel::H2 { 1 } else { 0 },",
          )
          text = re.sub(
              r"fn budget_json\(value: BudgetVector\) -> String \{.*?\n\}\n\Z",
              '''fn budget_json(value: BudgetVector) -> String {
              format!(
                  "{{\\\"latency_ms\\\":{},\\\"tokens\\\":{},\\\"bytes\\\":{},\\\"model_calls\\\":{},\\\"cpu_millis\\\":{},\\\"accelerator_millis\\\":{},\\\"energy_millijoules\\\":{},\\\"network_bytes\\\":{},\\\"storage_operations\\\":{},\\\"privacy_exposure\\\":{},\\\"operator_attention_seconds\\\":{}}}",
                  value.latency_ms,
                  value.tokens,
                  value.bytes,
                  value.model_calls,
                  value.cpu_millis,
                  value.accelerator_millis,
                  value.energy_millijoules,
                  value.network_bytes,
                  value.storage_operations,
                  value.privacy_exposure,
                  value.operator_attention_seconds,
              )
          }
          ''',
              text,
              flags=re.S,
          )
          binary.write_text(text)
          PY
          chmod +x scripts/beads_mark.py scripts/qualify-hydration.sh
          cargo fmt --all
      - name: Run complete code qualification
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          python3 -m unittest discover -s tests -p 'test_*.py'
          scripts/qualify-hydration.sh
          scripts/qualify.sh --lane policy --no-receipt
      - name: Reconcile semantic registries and exact project status
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/beads_mark.py \
            --external-ref FSS-210 \
            --status in_progress \
            --author repository-agent \
            --comment "Independent final audit qualified the deterministic reference and CLI surfaces, including immutable descriptor identity, H0-H4 authorization, receipt forgery clamps, byte-stable success/fallback/denial/expiry transcripts, workspace tests, Clippy, policy, and full local-style hosted qualification. The bead intentionally remains in progress pending production object-plane hydration, full cross-surface parity, broader fault/multi-agent campaigns, QL-AGENT-001, GATE-115, and local DSR release authority."
          python3 - <<'PY'
          from pathlib import Path

          def append_once(path: str, marker: str, body: str) -> None:
              file = Path(path)
              text = file.read_text()
              if marker not in text:
                  file.write_text(text.rstrip() + "\n\n" + body.strip() + "\n")

          append_once(
              "registries/CAPABILITIES.md",
              "<!-- FSS-210-CAPABILITIES -->",
              '''<!-- FSS-210-CAPABILITIES -->
          ## Semantic hydration capabilities

          `capability:evidence:hydrate:H0` through `capability:evidence:hydrate:H4` authorize only their exact registered levels; possession of a richer capability does not imply another level unless explicitly delegated. `capability:evidence:hydrate:debug` is an additional H4 debugging grant and is ineffective unless the descriptor permits `qualification_or_debug_grant` and the request purpose is `debugging`. Privacy-class authorization, current descriptor identity, retention, artifact availability, and full budget remain independent clamps.
          ''',
          )
          append_once(
              "registries/AGENT_OPERATIONS.md",
              "<!-- FSS-210-OPERATION -->",
              '''<!-- FSS-210-OPERATION -->
          ## `hydrate_semantic_handle`

          Inputs: exact `SemanticHandle` descriptor digest and subject digest, `ContractBasis`, session, authority anchor, requested H-level, lower-level fallback consent, delegated capabilities, authorized privacy classes, full `BudgetVector`, purpose, and optional exact continuation cursor. Output: one exact `HydrationArtifact` plus proof-bearing `HydrationReceipt`, or a stable typed denial/error. Retries with the same request digest are deterministic. A continuation requests exactly one next level and cannot fall back.
          ''',
          )
          append_once(
              "registries/AGENT_VIEWS.md",
              "<!-- FSS-210-VIEW -->",
              '''<!-- FSS-210-VIEW -->
          ## `AVIEW-HYDRATION`

          Exact progressive-evidence view for one immutable semantic handle. Its cursors use scope `evidence_hydration`, the handle as stream identity, the descriptor digest as source, the ladder-policy digest as selection witness, the next H-level ordinal as position, and the retention horizon as expiry. It never substitutes a derivative subject under the original handle.
          ''',
          )
          append_once(
              "registries/ERRORS.md",
              "<!-- FSS-210-ERRORS -->",
              '''<!-- FSS-210-ERRORS -->
          ## Semantic hydration errors

          | Code | Meaning |
          |---|---|
          | `semantic_handle_rebound` | A stable handle was presented with different immutable subject identity. |
          | `semantic_handle_descriptor_not_found` | The exact descriptor revision is unavailable. |
          | `hydration_level_unavailable` | The exact H-level or artifact is not published. |
          | `hydration_capability_denied` | Required level capability is absent. |
          | `hydration_privacy_denied` | The descriptor privacy class is not authorized. |
          | `hydration_laboratory_grant_required` | H4 purpose or explicit debugging grant is insufficient. |
          | `hydration_budget_exceeded` | No permitted requested/fallback level fits the full resource ceiling. |
          | `hydration_wrong_continuation` | Cursor handle, session, contract, anchor, descriptor, level, parent, or expiry is invalid. |
          ''',
          )
          append_once(
              "DATA_FORMATS.md",
              "<!-- FSS-210-DATA-FORMATS -->",
              '''<!-- FSS-210-DATA-FORMATS -->
          ## Semantic hydration object family

          The FSS-210 family consists of `semantic_handle.v1`, `semantic_hydration_artifact.v1`, `semantic_hydration_request.v1`, `semantic_hydration_receipt.v1`, and `agent_continuation_cursor.v1`. Handle identity covers only the immutable subject core. Descriptor identity additionally covers authority, availability, retention, privacy, capabilities, costs, levels, laboratory access, derivatives, and publication time. Artifact, request, receipt, and cursor digests cover their complete canonical bodies; none may be recomputed from display JSON ordering.
          ''',
          )
          append_once(
              "PRIVACY.md",
              "<!-- FSS-210-PRIVACY -->",
              '''<!-- FSS-210-PRIVACY -->
          ## Progressive hydration privacy boundary

          Hydration requires the descriptor's exact privacy class independently of H-level capability. H2 is an explicit transformed decision artifact; H3 is exact authorized source evidence; H4 is qualification or explicitly granted debugging material. When only a privacy-transformed derivative remains, the original handle returns `privacy_transformed` and may expose a distinct derivative handle. It never returns derivative bytes while claiming the original subject identity.
          ''',
          )
          append_once(
              "SECURITY.md",
              "<!-- FSS-210-SECURITY -->",
              '''<!-- FSS-210-SECURITY -->
          ## Semantic-handle security invariants

          Stable handles never rebind. Descriptor freshness, subject digest, contract basis, authority anchor, privacy class, capabilities, purpose, retention, artifact proof roots, complete budget, and exact cursor lineage are independently checked. A denial at one layer cannot be bypassed by a richer H-level, a stale descriptor, direct artifact possession, lower-level fallback, or a continuation from another session or handle.
          ''',
          )
          PY
          mkdir -p proofs/dev
          pre_receipt_commit="$(git rev-parse HEAD)"
          pre_receipt_tree="$(git write-tree)"
          cat > proofs/dev/FSS-210-final-reference-audit.json <<JSON
          {
            "schema": "fss.development_qualification.v1",
            "task": "FSS-210",
            "basis_commit_sha": "${pre_receipt_commit}",
            "qualified_worktree_sha": "${pre_receipt_tree}",
            "scope": [
              "dependency-free core contracts",
              "deterministic reference hydrator",
              "receipt forgery clamps",
              "wire schemas and semantic registries",
              "byte-stable CLI rehearsal transcripts"
            ],
            "checks": [
              "cargo fmt --all --check",
              "cargo check --workspace --all-targets",
              "cargo clippy --workspace --all-targets -- -D warnings",
              "cargo test --workspace",
              "python3 -m unittest discover -s tests -p test_*.py",
              "scripts/qualify-hydration.sh",
              "scripts/qualify.sh --lane policy --no-receipt",
              "scripts/qualify.sh --lane full --no-receipt"
            ],
            "status": "reference-qualified",
            "release_authority": "none; local DSR remains authoritative",
            "remaining": [
              "production object-plane hydration",
              "complete privacy-engine integration",
              "MCP TUI report and handoff transcript equivalence",
              "crash cancellation disconnect and multi-agent campaigns",
              "QL-AGENT-001",
              "GATE-115",
              "local DSR release root"
            ]
          }
          JSON
          rm -f \
            .github/workflows/mark-fss-210.yml \
            .github/workflows/validate-fss-210.yml \
            .github/workflows/normalize-fss-210-api.yml \
            .github/workflows/repair-fss-210.yml \
            .github/workflows/finalize-fss-210-reference.yml \
            .github/workflows/harden-fss-210-receipts.yml \
            .github/workflows/qualify-fss-hydration-cli.yml \
            .github/workflows/fss-210-serial-final-audit.yml
          python3 scripts/generate-manifest.py
      - name: Re-run the exact final-tree gate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          python3 -m unittest discover -s tests -p 'test_*.py'
          scripts/qualify-hydration.sh
          scripts/qualify.sh --lane policy --no-receipt
          scripts/qualify.sh --lane full --no-receipt
          test -z "$(find .github/workflows -maxdepth 1 -type f -name '*fss-210*' -o -name '*hydration-cli*')"
      - name: Commit and push the audited tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "agent: publish audited FSS-210 reference slice"
          git push origin HEAD:main
