# Local DSR/direct receipts are authoritative. GitHub-hosted execution is supplementary only.
name: RTSP reconnect recovery

on:
  push:
    branches: [main]
    paths:
      - 'crates/fss-cli/src/bin/fss-capture-rtsp/**'
      - 'crates/fss-cli/src/bin/fss-capture-rtsp.rs'
      - 'crates/fss-cli/tests/capture_rtsp_reconnect_cli*'
      - 'crates/fss-cli/tests/capture_rtsp_index_cli.rs'
      - 'tests/test_rtsp_reconnect_recovery.py'
      - 'crates/fss-reference/src/rtsp/**'
      - '.github/workflows/rtsp-reconnect-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rtsp-reconnect-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_NET_OFFLINE: true
      RUSTUP_AUTO_INSTALL: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Bootstrap the repository-pinned compiler
        run: bash scripts/bootstrap_toolchain.sh
      # All unit/integration/format/policy qualification lives in the
      # repository qualifier's workspace lanes; this workflow delegates rather
      # than duplicating lane logic.
      - name: Execute repository-owned Rust lane
        run: |
          mkdir -p "$RUNNER_TEMP/recovery-evidence"
          bash scripts/qualify.sh --lane rust --receipt-dir "$RUNNER_TEMP/recovery-evidence/qualification"
      # Cold-process end-to-end harness: drives the BUILT fss-capture-rtsp
      # binary against a mock RTSP camera over a real socket (cold AVC
      # reconnect recovery + source corruption). Not yet a qualify.sh lane
      # (claim-specific adapter lanes fail closed until dedicated harnesses
      # exist under scripts/lanes/), so it stays here as supplementary
      # evidence until the adapter lane owns it.
      - name: Cold AVC reconnect recovery and source corruption
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo +nightly-2026-08-31 build --locked --offline -p fss-cli --bin fss-capture-rtsp --message-format=json > "$RUNNER_TEMP/recovery-evidence/build.jsonl"
          binary=$(python3 -c 'import json,sys; rows=[json.loads(s) for s in open(sys.argv[1])]; paths=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("target",{}).get("name")=="fss-capture-rtsp" and r.get("executable")]; assert paths; print(paths[-1])' "$RUNNER_TEMP/recovery-evidence/build.jsonl")
          python3 -B tests/test_rtsp_reconnect_recovery.py "$binary" 2>&1 | tee "$RUNNER_TEMP/recovery-evidence/cold-process.log"
      - name: Preserve exact failure logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rtsp-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/recovery-evidence
          retention-days: 7
          if-no-files-found: error
