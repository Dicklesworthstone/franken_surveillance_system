[package]
name = "fss-reference"
description = "Deterministic virtual acquisition and replay reference for Franken Surveillance System"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
autotests = true

[[test]]
name = "reference_deployment_recovery_contract"
path = "tests/reference_deployment_recovery_contract.rs"

[[test]]
name = "doctor_deployment_contract"
path = "tests/doctor_deployment_contract.rs"

[lints]
workspace = true

[dependencies]
fss-core = { path = "../fss-core" }
fss-ledger = { path = "../fss-ledger" }
fss-model-ir = { path = "../fss-model-ir" }
fss-object = { path = "../fss-object" }
fss-publication = { path = "../fss-publication" }
fss-tensor = { path = "../fss-tensor" }

[dev-dependencies]
fss-core = { path = "../fss-core", features = ["test-support"] }
fss-packet = { path = "../fss-packet" }

