[package]
name = "fss-cli"
description = "Agent-friendly CLI shell for Franken Surveillance System"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "fss"
path = "src/main.rs"

[[bin]]
name = "fss-file"
path = "src/bin/fss-file.rs"

[[bin]]
name = "fss-infer"
path = "src/bin/fss-infer.rs"

[[bin]]
name = "fss-event"
path = "src/bin/fss-event.rs"

[[bin]]
name = "fss-archive"
path = "src/bin/fss-archive.rs"

[dependencies]
fss-core = { path = "../fss-core" }
fss-object = { path = "../fss-object" }
fss-publication = { path = "../fss-publication" }
fss-reference = { path = "../fss-reference" }

[dev-dependencies]
fss-packet = { path = "../fss-packet" }

[lints]
workspace = true
