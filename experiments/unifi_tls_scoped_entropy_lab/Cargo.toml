[package]
name = "fss-unifi-scoped-tls-entropy-lab"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
asupersync = { version = "=0.5.0", default-features = false }
fss-core = { path = "../../crates/fss-core" }
fss-geometry = { path = "../../crates/fss-geometry" }
fss-codec-mjpeg = { path = "../../crates/fss-codec-mjpeg" }
fss-codec-h264 = { path = "../../crates/fss-codec-h264" }
fss-codec-jpeg-encode = { path = "../../crates/fss-codec-jpeg-encode" }
fss-container = { path = "../../crates/fss-container" }
fss-packet = { path = "../../crates/fss-packet" }
fss-runtime = { path = "../../crates/fss-runtime" }
fss-reference = { path = "../../crates/fss-reference" }
rustls = { version = "=0.23.46", default-features = false, features = ["std"] }
rustls-pure = "=0.15.4"
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdh"] }
zeroize = "=1.9.1"
rustix = { version = "=1.1.6", features = ["fs"] }

x509-cert = { version = "=0.2.5", default-features = false, features = ["std"] }
fss-object = { path = "../../crates/fss-object" }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["net"] }

[dev-dependencies]
socket2 = "=0.6.5"

[patch.crates-io]
rustls = { path = "vendor/rustls" }
