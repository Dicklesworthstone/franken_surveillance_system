[fundamental]
allowed_subject_to_audit = ["serde", "serde_json", "zmij"]
rule = "Fundamental means bounded data-shape plumbing only. It grants no runtime, networking, storage, cryptography, parser, model, device, durable-format, or background-work authority."

[exception_candidates]
not_admitted_without_dep_record_adr_and_release_evidence = [
  "blake3", "thiserror", "zeroize", "rustls", "webpki-roots",
  "chacha20poly1305", "x25519-dalek", "hkdf", "sha2"
]

[resolved_drifts]
thiserror = "not_admitted; an older comprehensive-plan sentence grouped it with the default exception set, but no DEP record, ADR admission, Cargo dependency, or release evidence exists. Machine policy remains authoritative per ADR-0012."

[laboratory_oracles]
excluded_from_production_release_closure = [
  "ffmpeg", "ffprobe", "networkx", "pytorch", "onnxruntime", "opencv",
  "cuda-frameworks", "vendor-sdk", "vendor-application", "browser-capture"
]
requirements = [
  "exact_identity_and_license",
  "fixture_only_inputs",
  "no_production_credentials",
  "no_effect_authority",
  "no_runtime_invocation_path_from_production",
  "bounded_output_schema",
  "tainted_provenance",
  "release_absence_proof"
]

# Machine split of excluded_from_production_release_closure across the two DEP-CLASS-F4 registry rows
# (architecture/dependencies.json). Every excluded oracle appears in exactly one row list.
[laboratory_oracles.rows]
"DEP-LAB-001" = ["ffmpeg", "ffprobe", "onnxruntime", "opencv", "cuda-frameworks", "vendor-sdk", "vendor-application", "browser-capture"]
"DEP-ORACLE-001" = ["networkx", "pytorch"]

[forbidden]
crates = [
  "tokio", "async-std", "smol", "glommio", "monoio", "rayon",
  "reqwest", "hyper", "rusqlite", "sqlx", "diesel", "rocksdb",
  "pyo3", "opencv", "ffmpeg-next", "gstreamer", "ort", "tch"
]
patterns = [
  "ambient credential access",
  "in-process proprietary SDK",
  "production foreign helper process",
  "production Python runtime",
  "production FFmpeg executable",
  "C or C++ FFI",
  "dynamic library discovery",
  "unversioned model download",
  "runtime network install",
  "hidden detached thread",
  "second executor",
  "serde-derived durable enum",
  "hosted-runner-only qualification"
]

# Owner decisions that are still open. A crate listed here is neither admitted nor rejected: every
# dependency mechanism reports it as pending until the owner records the decision.
[pending_owner_decisions.fss-ndxis]
registry_row = "DEP-FUND-001"
crates = ["serde", "serde_json"]
question = "serde and serde_json: the FSS-110 blanket ban versus DEP-FUND-001 control-plane admission is undecided. NOTE 2026-10-18: 'zmij' is serde_json 1.0.154's new transitive crate, pulled into the closure by asupersync's mandatory serde_json dependency (FSS-021/fss-runtime); it rides the SAME pending decision as serde_json, not a new violation — the owner decision covers the serde_json closure as one unit"
